<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <title>Document</title>
  </head>
  <body>
    <div
      style="
        padding: 12px;
        border-bottom: 1px solid #222;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
      "
    >
      <b style="font-size: 13px">IG Checker</b>
      <div style="display: flex; gap: 8px">
        <button
          id="_crrg"
          style="
            background: none;
            border: none;
            padding: 8px;
            font-size: 18px;
            color: green;
            font-weight: bold;
            cursor: pointer;
          "
        >
          <i id="_crrg_icon" />
          <i class="fa fa-eye" aria-hidden="true"></i>
          <i class="fa fa-eye-slash" aria-hidden="true"></i>
        </button>
        <button
          id="_rmv"
          style="
            background: none;
            border: none;
            color: #666;
            font-size: 18px;
            cursor: pointer;
            line-height: 1;
          "
        >
          x
        </button>
      </div>
    </div>
    <div id="_b" style="padding: 12px; flex: 1; overflow-y: auto">
      <div id="_s" style="font-size: 12px; color: #888; margin-bottom: 8px">
        Iniciando...
      </div>
      <div
        style="
          height: 3px;
          background: #222;
          border-radius: 2px;
          margin-bottom: 10px;
        "
      >
        <div
          id="_p"
          style="
            height: 100%;
            background: #b0ff3e;
            border-radius: 2px;
            width: 0;
            transition: width 0.3s;
          "
        ></div>
      </div>
      <div id="_l"></div>
      <div id="_f"></div>
      <div
        id="_clr"
        style="
          position: absolute;
          bottom: 20px;
          right: 20px;
          z-index: 9999;
          display: flex;
          justify-content: center;
          align-items: center;
          width: 30px;
          height: 30px;
          border-radius: 50%;
          border: none;
          background: none;
          color: rgb(222, 0, 0);
          /* box-shadow: 0 4px 6px rgba(86, 30, 30, 0.61); */
          cursor: pointer;
          transition:
            opacity 0.3s ease,
            transform 0.3s ease;
          opacity: 1;
          visibility: visible;
          transform: scale(1);
        "
        onmouseover="
          this.style.opacity = '0.8';
          this.style.transform = 'scale(1.1)';
          this.style.filter =
            'drop-shadow(0px 2px 1.3px rgba(86, 30, 30, 0.61))';
        "
        onmouseout="
          this.style.opacity = '1';
          this.style.transform = 'scale(1)';
          this.style.filter =
            'drop-shadow(0px 2px 0.9px rgba(86, 30, 30, 0.61))';
        "
      >
        k<span style="font-size: 18px" disabled>k✅</span>
      </div>
    </div>
  </body>
</html>
